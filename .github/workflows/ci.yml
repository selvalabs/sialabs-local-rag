name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest with coverage
        run: uv run --with pytest-cov pytest --cov=sialabs_local_rag --cov-report=term-missing --cov-report=xml

      - name: Mypy
        run: uv run mypy src

      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py openapi.json

      - name: Verify OpenAPI export is committed
        working-directory: .
        run: git diff --exit-code -- backend/openapi.json

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI TypeScript client
        run: npm run generate:api

      - name: Verify generated OpenAPI client is committed
        run: git diff --exit-code -- src/generated/openapi.ts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Vitest
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  containers:
    name: Docker build and smoke gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: |
          cp .env.example .env
          mkdir -p data
          sudo chown -R 10001:10001 data

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start application stack
        run: docker compose up -d backend frontend

      - name: Smoke test backend and frontend
        run: |
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors --retry-max-time 120 http://127.0.0.1:8000/health
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:5173/
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:5173/manifest.webmanifest
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:5173/service-worker.js
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:5173/icon.svg
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:5173/maskable-icon.svg

      - name: Set up Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  pester:
    name: Pester contract gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compatible Pester
        shell: pwsh
        run: |
          $minimum = [version]'5.5.0'
          $pester = Get-Module Pester -ListAvailable |
            Where-Object { $_.Version -ge $minimum } |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if (-not $pester) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
            $pester = Get-Module Pester -ListAvailable |
              Where-Object { $_.Version -ge $minimum } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          }

          if (-not $pester) {
            throw 'Pester >= 5.5.0 is required.'
          }

          Import-Module $pester.Path -Force
          Write-Host "Using Pester $($pester.Version) from $($pester.Path)"

      - name: Run Pester contracts
        shell: pwsh
        run: Invoke-Pester -Path scripts/tests -CI
